<!DOCTYPE html>
<html lang="hu"><head>
<meta charset="utf-8">
<title>Edzés közben</title>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0}
a{color:#3F5675}a:hover{color:#16233A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E3F2FC; color: #16233A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Edzes.dc.html" aria-label="Edzés bezárása" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #16233A"><svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #3F5675"><span>Fő rész</span><span>{{pos}} / 14</span></div>
<div style="display: flex; gap: 3px">
<sc-for list="{{segs}}" as="seg" hint-placeholder-count="14"><div style="flex-grow: 1; height: 5px; border-radius: 3px; background: {{seg.bg}}"></div></sc-for>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">{{ex.hu}}</h1>
<div style="font-size: 15px; font-weight: 600; color: #3F5675">{{ex.en}} · {{ex.dose}}</div>
</div>

<div style="position: relative; height: 260px; display: flex; align-items: center; justify-content: center">
<svg width="240" height="240" sc-camel-view-box="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="104" fill="none" stroke="#FFFFFF" stroke-width="12"></circle><circle cx="120" cy="120" r="104" fill="none" stroke="{{ring}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="653.5" stroke-dashoffset="{{offset}}" transform="rotate(-90 120 120)"></circle></svg>
<div style="position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 54px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{time}}</div>
<div style="font-size: 14px; font-weight: 600; color: #3F5675">{{status}}</div>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#D9759A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M4 12c3-4 5-4 8 0s5 4 8 0"></path><path d="M4 17c3-4 5-4 8 0s5 4 8 0"></path></svg>
<div style="font-size: 15px; line-height: 1.5">{{ex.cue}}</div>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 28px">
<button type="button" aria-label="Előző gyakorlat" sc-camel-on-click="{{prev}}" style="width: 56px; height: 56px; border-radius: 50%; border: none; background: #FFFFFF; color: #16233A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 5.5v13l-9-6.5z"></path><rect x="5" y="5" width="2.5" height="14" rx="1"></rect></svg></button>
<button type="button" aria-label="{{toggleLabel}}" sc-camel-on-click="{{toggle}}" style="width: 80px; height: 80px; border-radius: 50%; border: none; background: #8EC9EE; color: #16233A; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{running}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" sc-camel-view-box="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"></rect><rect x="14" y="5" width="4" height="14" rx="1.2"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ true }}"><svg width="30" height="30" sc-camel-view-box="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg></sc-if>
</button>
<button type="button" aria-label="Következő gyakorlat" sc-camel-on-click="{{next}}" style="width: 56px; height: 56px; border-radius: 50%; border: none; background: #FFFFFF; color: #16233A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5.5v13l9-6.5z"></path><rect x="16.5" y="5" width="2.5" height="14" rx="1"></rect></svg></button>
</div>

<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid #C9E2F5">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; color: #3F5675; text-transform: uppercase; letter-spacing: 0.05em">Következő</span><span style="font-size: 15px; font-weight: 700">{{nextName}}</span></div>
<a href="Befejezes.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700">Edzés befejezése</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;ring&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5FAEE3&quot;,&quot;options&quot;:[&quot;#5FAEE3&quot;,&quot;#E98DAE&quot;,&quot;#8EC9EE&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  list() {
    return [
      { hu: 'Százas', en: 'The Hundred', dose: '100 számolás', sec: 100, cue: 'Kilégzés 5 pumpálásra, belégzés 5-re. A lapockák maradjanak fent, a nyak laza.' },
      { hu: 'Felgördülés', en: 'Roll Up', dose: '8 ismétlés', sec: 120, cue: 'Csigolyánként gördülj, lendület nélkül. Kilégzésre húzd a köldököt a gerinc felé.' },
      { hu: 'Egylábas körzés', en: 'Single Leg Circles', dose: '5 / irány / oldal', sec: 120, cue: 'A medence mozdulatlan marad — inkább kisebb, de pontos kört rajzolj.' },
      { hu: 'Gurulás labdaként', en: 'Rolling Like a Ball', dose: '8 ismétlés', sec: 75, cue: 'Maradj kicsi labda. A lapockákig gurulj vissza, a nyakra soha.' },
      { hu: 'Egylábas nyújtás', en: 'Single Leg Stretch', dose: '10 / oldal', sec: 90, cue: 'A felső hát végig fent marad, a könyökök szélesen nyitva.' }
    ];
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state || {};
      if (!s.running) return;
      const list = this.list();
      const i = s.idx ?? 1;
      const left = (s.left ?? list[i].sec) - 1;
      if (left <= 0) { this.go(1); } else { this.setState({ left: left }); }
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  go(d) {
    const list = this.list();
    const s = this.state || {};
    const i = Math.min(Math.max((s.idx ?? 1) + d, 0), list.length - 1);
    this.setState({ idx: i, left: list[i].sec });
  }
  renderVals() {
    const s = this.state || {};
    const list = this.list();
    const i = s.idx ?? 1;
    const ex = list[i];
    const left = s.left ?? ex.sec;
    const running = !!s.running;
    const pos = i + 5;
    const segs = [];
    for (let k = 1; k <= 14; k++) {
      segs.push({ bg: k < pos ? '#5FAEE3' : (k === pos ? '#16233A' : '#FFFFFF') });
    }
    const mm = Math.floor(left / 60);
    const ss = String(left % 60).padStart(2, '0');
    return {
      ring: this.props.ring ?? '#5FAEE3',
      ex: ex,
      pos: pos,
      segs: segs,
      time: mm + ':' + ss,
      offset: (653.5 * (1 - left / ex.sec)).toFixed(1),
      status: running ? 'hátralévő idő' : 'szünetel — koppints a lejátszásra',
      running: running,
      paused: !running,
      toggleLabel: running ? 'Szünet' : 'Indítás',
      toggle: () => this.setState({ running: !running }),
      prev: () => this.go(-1),
      next: () => this.go(1),
      nextName: list[i + 1] ? list[i + 1].hu : 'Kétlábas nyújtás'
    };
  }
}
</script>


</body></html>
