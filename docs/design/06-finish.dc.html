<!DOCTYPE html>
<html lang="hu"><head>
<meta charset="utf-8">
<title>Edzés vége</title>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0}
a{color:#2B6CA3}a:hover{color:#1D4E7A}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #EEF5FB; color: #16233A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 36px 20px 32px; display: flex; flex-direction: column; gap: 22px">
<header style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<div style="width: 72px; height: 72px; border-radius: 50%; background: {{accent}}; color: #16233A; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Szép munka!</h1>
<div style="font-size: 15px; color: #4F5F75">Core &amp; gerinc · 3. hét · B edzés</div>
</header>

<section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #FFFFFF; border: 1px solid #D6E3EF; border-radius: 16px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 22px; font-weight: 800">51:20</span><span style="font-size: 12px; font-weight: 600; color: #4F5F75">időtartam</span></div>
<div style="background: #FFFFFF; border: 1px solid #D6E3EF; border-radius: 16px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 22px; font-weight: 800">14 / 14</span><span style="font-size: 12px; font-weight: 600; color: #4F5F75">gyakorlat</span></div>
<div style="background: #FFFFFF; border: 1px solid #D6E3EF; border-radius: 16px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 22px; font-weight: 800; color: #B04673">8</span><span style="font-size: 12px; font-weight: 600; color: #4F5F75">edzés sorozat</span></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #D6E3EF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">Mennyire volt nehéz?</h2>
<div role="radiogroup" aria-label="Érzett nehézség" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{levels}}" as="lv" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{lv.checked}}" sc-camel-on-click="{{lv.pick}}" style="height: 64px; border-radius: 14px; border: 2px solid {{lv.border}}; background: {{lv.bg}}; color: {{lv.fg}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer"><span style="font-size: 18px; font-weight: 800">{{lv.n}}</span><span style="font-size: 10px; font-weight: 700">{{lv.short}}</span></button>
</sc-for>
</div>
<div style="background: {{accentSoft}}; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 800">{{chosen.label}}</div>
<div style="font-size: 14px; line-height: 1.45; color: #364559">{{chosen.hint}}</div>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #D6E3EF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">Hol érezted leginkább?</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{areas}}" as="ar" hint-placeholder-count="6">
<button type="button" aria-pressed="{{ar.on}}" sc-camel-on-click="{{ar.flip}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{ar.border}}; background: {{ar.bg}}; color: {{ar.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{ar.name}}</button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<label for="jegyzet" style="font-size: 17px; font-weight: 800">Jegyzet</label>
<textarea id="jegyzet" rows="3" placeholder="Pl. a felgördülésnél a 3. ismétléstől kellett a könnyítés…" style="box-sizing: border-box; width: 100%; border-radius: 16px; border: 1px solid #C2D2E3; background: #FFFFFF; padding: 12px 14px; font-family: inherit; font-size: 15px; color: #16233A; resize: none"></textarea>
</section>

<a href="Naplo.dc.html" style="margin-top: auto; height: 56px; border-radius: 16px; background: {{accent}}; color: #16233A; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; text-decoration: none">Mentés a naplóba</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8EC9EE&quot;,&quot;options&quot;:[&quot;#8EC9EE&quot;,&quot;#B3DCF5&quot;,&quot;#F6BED1&quot;,&quot;#C3CDF2&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:1120}}">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8EC9EE';
    const s = this.state || {};
    const sel = s.level ?? 3;
    const on = s.areas ?? { 'Has': true };
    const defs = [
      { n: 1, short: 'Nagyon könnyű', label: 'Nagyon könnyű', hint: 'A következő edzésen +1 ismétlés vagy hosszabb tartás jön.' },
      { n: 2, short: 'Könnyű', label: 'Könnyű', hint: 'Ha a héten még egyszer könnyűnek jelölöd, a program előrehozza a nehezebb változatokat.' },
      { n: 3, short: 'Pont jó', label: 'Pont jó', hint: 'Így tovább — a program a terv szerint halad a következő héttel.' },
      { n: 4, short: 'Nehéz', label: 'Nehéz', hint: 'A következő edzésen az új gyakorlatoknál felajánljuk a könnyített változatot.' },
      { n: 5, short: 'Túl nehéz', label: 'Túl nehéz', hint: 'A következő edzés ugyanezen a szinten marad, rövidebb tartásokkal.' }
    ];
    const levels = defs.map((d) => {
      const active = d.n === sel;
      return {
        n: d.n, short: d.short,
        checked: active ? 'true' : 'false',
        border: active ? accent : '#D6E3EF',
        bg: active ? accent : '#FFFFFF',
        fg: active ? '#16233A' : '#16233A',
        pick: () => this.setState({ level: d.n })
      };
    });
    const names = ['Has', 'Hát', 'Far', 'Comb', 'Váll', 'Nyak'];
    const areas = names.map((nm) => {
      const a = !!on[nm];
      return {
        name: nm,
        on: a ? 'true' : 'false',
        border: a ? accent : '#C2D2E3',
        bg: a ? accent + '40' : '#FFFFFF',
        fg: '#16233A',
        flip: () => { const next = Object.assign({}, on); next[nm] = !a; this.setState({ areas: next }); }
      };
    });
    return { accent: accent, accentInk: '#' + [1, 3, 5].map(function (i) { return Math.round(parseInt(accent.substr(i, 2), 16) * 0.45).toString(16).padStart(2, '0'); }).join(''), accentSoft: accent + '40', levels: levels, chosen: defs[sel - 1], areas: areas };
  }
}
</script>


</body></html>
